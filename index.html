<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muhamad Ramdhani Akbar — Personal Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-primary:   #ffffff;
      --bg-secondary: #f7f7f7;
      --text-primary: #0a0a0a;
      --text-muted:   #6b6b6b;
      --border:       #e0e0e0;
    }

    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: "DM Sans", sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }

    /* ── NAV ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border);
    }

    nav {
      max-width: 1200px;
      margin: 0 auto;
      height: 60px;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-brand {
      font-family: "Inter", sans-serif;
      font-weight: 900;
      font-size: 1.1rem;
      color: var(--text-primary);
      text-decoration: none;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      gap: 0;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.5rem 1.1rem;
      transition: color 0.15s;
    }

    .nav-links a:hover {
      color: var(--text-primary);
    }

    .nav-links a.active {
      color: var(--text-primary);
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="#home" class="nav-brand">MRA.</a>
      <ul class="nav-links">
        <li><a href="#home" class="active">Home</a></li>
        <li><a href="#about">About</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- sections coming soon -->
  </main>

</body>
</html>
