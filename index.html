<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muhamad Ramdhani Akbar — Personal Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-primary:   #ffffff;
      --bg-secondary: #f7f7f7;
      --text-primary: #0a0a0a;
      --text-muted:   #6b6b6b;
      --border:       #e0e0e0;
    }

    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: "DM Sans", sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }

    /* ── NAV ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border);
    }

    nav {
      max-width: 1200px;
      margin: 0 auto;
      height: 60px;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-brand {
      font-family: "Inter", sans-serif;
      font-weight: 900;
      font-size: 1.1rem;
      color: var(--text-primary);
      text-decoration: none;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      gap: 0;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.5rem 1.1rem;
      transition: color 0.15s;
    }

    .nav-links a:hover {
      color: var(--text-primary);
    }

    .nav-links a.active {
      color: var(--text-primary);
    }

    /* ── HERO ── */
    .hero {
      min-height: calc(100vh - 60px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6rem 2rem;
      border-bottom: 1px solid var(--border);
    }

    .hero-greeting {
      font-family: "DM Sans", sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .hero-name {
      font-family: "Inter", sans-serif;
      font-weight: 900;
      font-size: clamp(3.5rem, 10vw, 8.5rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
      color: var(--text-primary);
      text-transform: uppercase;
      margin-bottom: 2.5rem;
    }

    .hero-tagline {
      font-family: "DM Sans", sans-serif;
      font-size: clamp(1rem, 2vw, 1.2rem);
      font-weight: 400;
      color: var(--text-muted);
      max-width: 480px;
      line-height: 1.6;
    }

    .hero-divider {
      width: 40px;
      height: 1px;
      background: var(--border);
      margin: 2.5rem auto;
    }

    /* ── INFO / CONTACT ── */
    .info {
      max-width: 1200px;
      margin: 0 auto;
      padding: 5rem 2rem;
      border-bottom: 1px solid var(--border);
    }

    .info-header {
      font-family: "DM Sans", sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 3rem;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 2.5rem 3rem;
    }

    .info-item-label {
      font-family: "DM Sans", sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .info-item-value {
      font-family: "Inter", sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
      text-decoration: none;
      letter-spacing: -0.01em;
      display: inline-block;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s;
    }

    .info-item-value:hover {
      border-bottom-color: var(--text-primary);
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="#home" class="nav-brand">MRA.</a>
      <ul class="nav-links">
        <li><a href="#home" class="active">Home</a></li>
        <li><a href="#about">About</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section class="hero" id="home">
      <p class="hero-greeting">Halo, selamat datang</p>
      <h1 class="hero-name">Muhamad<br>Ramdhani<br>Akbar</h1>
      <div class="hero-divider"></div>
      <p class="hero-tagline">Mahasiswa & enthusiast teknologi yang sedang membangun sesuatu yang bermakna.</p>
    </section>

    <section class="info" id="about">
      <p class="info-header">Kontak & Sosial Media</p>
      <div class="info-grid">

        <div>
          <p class="info-item-label">Email</p>
          <a class="info-item-value" href="mailto:ramdhaniakbarmuhamad@gmail.com">ramdhaniakbarmuhamad@gmail.com</a>
        </div>

        <div>
          <p class="info-item-label">Instagram</p>
          <a class="info-item-value" href="https://instagram.com/rmdhni.akbarr" target="_blank" rel="noopener">@rmdhni.akbarr</a>
        </div>

        <div>
          <p class="info-item-label">LinkedIn</p>
          <a class="info-item-value" href="https://linkedin.com/in/ramdhaniakbar" target="_blank" rel="noopener">Muhamad Ramdhani Akbar</a>
        </div>

        <div>
          <p class="info-item-label">GitHub</p>
          <a class="info-item-value" href="https://github.com/ramdhaniakbar" target="_blank" rel="noopener">ramdhaniakbar</a>
        </div>

      </div>
    </section>

  </main>

</body>
</html>
